<style>

.wd.on{background:#dbe6fb;box-shadow:inset 0 0 0 2px var(--acc)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 8px;border-radius:9px;font-size:16px}
.menu button:active{background:#f0f0ec}
.note{font-size:12px;color:#888;margin-top:4px}
input[type=range]{width:100%;height:34px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}

.mbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}

.vbar{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:8px;z-index:2}

.help h3{margin:18px 0 6px}

.empty{padding:30px 10px;text-align:center;color:#888}
.rtb{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap}

.rtb button.on{background:#dbe6fb;box-shadow:inset 0 0 0 2px var(--acc)}

.cols>.ci{flex:0 0 34%}
.cols>.cd{flex:1 1 0}
.imgwrap{position:relative}
.cols.ed{gap:2px}

    '<h3>Übungen</h3><ul><li>Übungen direkt für die Datenbank anlegen. Hier sind Ziel, Spieler je Position und Beschreibung Pflicht.</li><li>Suchen und nach Ziel oder Spielerzahl filtern.</li></ul>' +
    '<h3>Sichern und auf andere Geräte bringen</h3><ul><li>☰ → Einstellungen → <b>Speichern</b>: alles in einer Datei, oder Übungsdatenbank und Trainings getrennt. Dort kann man auch eine vorhandene Gesamtdatei aufteilen oder zwei Dateien zusammenführen. Laden versteht alle Dateiarten, auch mehrere auf einmal.</li><li>Alle Daten liegen nur auf diesem Gerät. <b>☰ → Sichern</b> legt eine Datei ab (z. B. in iCloud Drive, OneDrive oder Google Drive über „In Dateien sichern“).</li>' +
    '<li>Auf dem anderen Gerät: <b>☰ → Laden</b> und die Datei wählen. Laden ergänzt: Neueres bleibt erhalten, gelöschte Einträge werden auch dort gelöscht.</li>' +
    '<li><b>Training auf einem anderen Gerät geplant?</b> Dort <b>☰ → Trainings weitergeben</b>, Trainings ankreuzen und die Datei sichern bzw. teilen. Auf dem eigenen Gerät <b>☰ → Laden</b> und die Datei wählen: Die Trainings und ihre Übungen kommen dazu, gelöscht wird nichts. Alternativ <b>☰ → Laden → „Nur einzelne Trainings aus einer Datei“</b>: aus jeder Sicherung (auch einer Gesamtdatei des anderen Geräts) nur die angekreuzten Trainings übernehmen.</li>' +
    '<li>Regelmäßig sichern! Ein Punkt am ☰ erinnert, wenn länger nicht gesichert wurde. Wird die App gelöscht, sind die Daten auf dem Gerät weg.</li></ul>' +
    '<h3>Cloud-Datenbank (Dropbox, OneDrive, Google Drive)</h3><ul>' +
    '<li>☰ → Einstellungen → <b>Datenbank</b>: „Nur Gerät + Datei“ (wie bisher) oder ein Cloud-Speicher. Dann gleichen sich alle verbundenen Geräte ab: Änderungen gehen nach wenigen Sekunden in die Cloud, andere Geräte zeigen sie beim Öffnen bzw. nach spätestens 15 Sekunden. Bei Änderungen am selben Eintrag gilt der neuere Stand.</li>' +
    '<li>Einmalig beim Anbieter eine „App“ anlegen und den Schlüssel in den Einstellungen eintragen (auf jedem Gerät). Weiterleitungs-Adresse: <b>' + redirectUri() + '</b><br>' +
    '<b>Dropbox</b> (empfohlen): dropbox.com/developers/apps → Create app → Scoped access → App folder → Name. Reiter Permissions: files.metadata.read, files.content.read, files.content.write → Submit. Reiter Settings: Redirect URI eintragen → „App key“ kopieren.<br>' +

    '<b>Google Drive</b>: console.cloud.google.com → Projekt → Google Drive API aktivieren → OAuth-Zustimmungsbildschirm (extern, Testnutzer: eigene Adresse, Bereich drive.appdata) → Anmeldedaten → OAuth-Client „Webanwendung“, JavaScript-Ursprung ' + location.origin + ', Weiterleitungs-URI wie oben → Client-ID kopieren.</li>' +
    '<li>Die Daten liegen im App-Ordner des Anbieters (Dropbox/OneDrive: Ordner „Apps“; Google: versteckter App-Bereich). Je Übung und Training eine Datei.</li>' +

    '<li><b>Anmeldeseite lädt nicht</b> (z. B. iPad Air 2 mit iOS 15): Auf einem verbundenen Gerät Einstellungen → Datenbank → „Verbindung an anderes Gerät weitergeben …“ → Code kopieren (z. B. per AirDrop/Notizen übertragen) → auf dem alten Gerät Einstellungen → Datenbank → „Code einfügen …“. Der Code ist wie ein Passwort.</li>' +
    '<li><b>Aufbau</b> (eine Datenbank oder Übungen und Trainings getrennt) und die Art der Dateisicherung gelten für alle verbundenen Geräte. Ändern nur in den Einstellungen mit Bestätigung; die Daten werden dann in der Cloud umgeschrieben, andere Geräte übernehmen den Aufbau beim nächsten Abgleich.</li>' +
    '<li>Der <b>orange Punkt</b> am ☰ zeigt, dass etwas zu tun ist (Anmeldung, Fehler, fällige Dateisicherung); der Grund steht oben im Menü. Mit verbundener Cloud erinnert die App standardmäßig nicht mehr an die Dateisicherung.</li>' +

  try { var P = CLOUD_P[S.cloud], f = (await P.list()).filter(function (x) { return x.name === CLOUD_CFG; })[0]; cloudState().cfgRev = await P.put(CLOUD_CFG, JSON.stringify(cloudCfg()), f); markKv('cloudState'); flush(); } catch (e) {}
}
function cloudOn() { var a = DB.kv.cloudAuth; return !!(S.cloud && S.cloud !== 'none' && a && a.prov === S.cloud && CLOUD_P[S.cloud]); }
function cloudBases() { var e = safeBase(S.cloudDbEx || 'VB Training'); return { ex: e, tr: S.cloudSplit ? safeBase(S.cloudDbTr || 'VB Training Trainings') : e }; }
function cloudState() {
  var s = DB.kv.cloudState;
  if (!s || s.prov !== S.cloud) { s = DB.kv.cloudState = { prov: S.cloud, known: {}, meta: {}, last: 0, dirty: false }; markKv('cloudState'); }
  return s;
}
function isBusy() {
  if (inp || penDown || Date.now() - lastPenUp < 4000 || Date.now() - CS.lastAct < 3000) return true;
  var a = document.activeElement;
  if (a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) return true;
  return !!document.querySelector('.modal,.viewer,.tview');
}
['pointerdown', 'keydown'].forEach(function (t) { document.addEventListener(t, function () { CS.lastAct = Date.now(); }, true); });
function visibleTrId() { return st.view === 'run' ? st.runId : st.view === 'plan' ? (st.picker ? st.picker.tr : st.trId) : null; }

function cloudKick() {
  if (!cloudOn() || CS.applying) return;
  var s = cloudState(); if (!s.dirty) { s.dirty = true; markKv('cloudState'); }
  if (S.cloudMode === 'manual') { updCloudUi(); return; }
  clearTimeout(CS.kickT); CS.kickT = setTimeout(function () { cloudSync(); }, 2500);
}
function applyTombstones() {
  var n = 0, del = DB.kv.deleted || {};
  Object.keys(del).forEach(function (id) {
    var e = DB.ex.get(id); if (e && (e.updated || 0) <= del[id]) { DB.ex.delete(id); idbDel('ex', id); n++; }
    var r = DB.tr.get(id); if (r && (r.updated || 0) <= del[id]) { DB.tr.delete(id); idbDel('tr', id); n++; }
  });
  return n;
}

async function cloudSync(manual) {
  if (!cloudOn()) return null;
  if (CS.hold) return null;
  if (CS.busy) { CS.again = true; return null; }
  if (!navigator.onLine) { CS.status = 'offline'; updCloudUi(); if (manual) toast('Keine Internetverbindung'); return null; }
  CS.busy = true; CS.err = ''; CS.progress = ''; updCloudUi();
  var P = CLOUD_P[S.cloud], s = cloudState(), B, res = { ex: 0, tr: 0, del: 0, up: 0, deferred: false, touched: [], cfg: false }, held = {};
  var bases, kinds;
  try {
    flush(); CS.applying = true;
    var list = await P.list(), L = {};
    list.forEach(function (f) { L[f.name] = f; });
    res.cfg = await cloudReadCfg(P, L, s);
    B = cloudBases(); bases = B.ex === B.tr ? [B.ex] : [B.ex, B.tr]; kinds = [['ex', B.ex, DB.ex], ['tr', B.tr, DB.tr]];
    // 1. Meta (Löschungen, Vorschläge) holen
    for (var bi = 0; bi < bases.length; bi++) {
      for (var mi = 0; mi < 2; mi++) {
        var mk = mi ? 'lex' : 'deleted', mn = bases[bi] + '__meta__' + mk + '.json', mf = L[mn], mm = s.meta[mn];
        if (mf && (!mm || mm.rev !== mf.rev)) {
          var mo = JSON.parse(await P.get(mn, mf) || '{}');
          if (mk === 'deleted') { Object.keys(mo).forEach(function (id) { if (!DB.kv.deleted[id] || DB.kv.deleted[id] < mo[id]) DB.kv.deleted[id] = mo[id]; }); markKv('deleted'); }
          else { mergeLex(DB.kv.lex, mo); markKv('lex'); }
          s.meta[mn] = { rev: mf.rev, hash: mm ? mm.hash : '' };
        }
      }
    }
    res.del += applyTombstones();
    var busyTr = isBusy() ? visibleTrId() : null;
    // 2. Geänderte Einträge holen
    for (var ki = 0; ki < 2; ki++) {
      var kind = kinds[ki][0], pre = kinds[ki][1] + '__' + kind + '__', map = kinds[ki][2];
      var names = Object.keys(L).filter(function (n) { return n.indexOf(pre) === 0 && /\.json$/.test(n); });
      for (var ni = 0; ni < names.length; ni++) {
        var name = names[ni], f = L[name], k = s.known[name], id = name.slice(pre.length, -5);
        if (k && k.rev === f.rev) continue;
        if (kind === 'tr' && id === busyTr) { res.deferred = true; held[name] = 1; continue; }   // gerade in Bearbeitung: später
        CS.progress = 'lädt ' + (ni + 1) + '/' + names.length; updCloudUi();
        var rec = JSON.parse(await P.get(name, f));
        var tomb = DB.kv.deleted[id], loc = map.get(id);
        if (DB.kv.cloudLocal && DB.kv.cloudLocal[id]) { delete DB.kv.cloudLocal[id]; markKv('cloudLocal'); }
        if (!(tomb && tomb >= rec.updated) && (!loc || (rec.updated || 0) > (loc.updated || 0))) {
          rec = kind === 'ex' ? normEx(rec) : normTr(rec);
          map.set(id, rec); idbPut(kind, rec); res[kind]++; res.touched.push(id);
        }
        s.known[name] = { rev: f.rev, upd: rec.updated || 0 };
      }
    }
    // 3. Eigene Änderungen hochladen
    var todo = [];
    kinds.forEach(function (kd) {
      kd[2].forEach(function (rec) {
        var name = cloudPath(kd[1], kd[0], rec.id), k = s.known[name];
        if (held[name]) return;   // Cloud hat eine neuere Fassung, die wir noch nicht geholt haben
        if (DB.kv.cloudLocal && DB.kv.cloudLocal[rec.id] && !L[name]) return;   // bleibt nur auf diesem Gerät
        if (!L[name] || !k || (rec.updated || 0) > (k.upd || 0)) todo.push([name, rec]);
      });
    });
    for (var ti = 0; ti < todo.length; ti++) {
      CS.progress = 'sendet ' + (ti + 1) + '/' + todo.length; updCloudUi();
      var rc = todo[ti][1], u = rc.updated || 0, body = JSON.stringify(rc);
      var rev = await P.put(todo[ti][0], body, L[todo[ti][0]]);
      s.known[todo[ti][0]] = { rev: rev, upd: u }; res.up++;
    }
    // 4. Gelöschtes auch in der Cloud löschen
    for (var kj = 0; kj < 2; kj++) {
      var pre2 = kinds[kj][1] + '__' + kinds[kj][0] + '__', map2 = kinds[kj][2];
      var dn = Object.keys(L).filter(function (n) { return n.indexOf(pre2) === 0; });
      for (var di = 0; di < dn.length; di++) {
        var id2 = dn[di].slice(pre2.length, -5), t2 = DB.kv.deleted[id2], k2 = s.known[dn[di]];
        if (t2 && !map2.has(id2) && (!k2 || t2 >= (k2.upd || 0))) { await P.del(dn[di], L[dn[di]]); delete s.known[dn[di]]; }
      }
    }
    // 5. Meta hochladen, wenn sich etwas geändert hat
    for (var bj = 0; bj < bases.length; bj++) {
      var metas = [['deleted', JSON.stringify(DB.kv.deleted || {})], ['lex', JSON.stringify(DB.kv.lex || {})]];
      for (var mj = 0; mj < 2; mj++) {
        var nm = bases[bj] + '__meta__' + metas[mj][0] + '.json', hs = strHash(metas[mj][1]), cur = s.meta[nm];
        if (!L[nm] || !cur || cur.hash !== hs) { var rv = await P.put(nm, metas[mj][1], L[nm]); s.meta[nm] = { rev: rv, hash: hs }; }
      }
    }
    // Einträge, die es in der Cloud nicht mehr gibt, vergessen
    Object.keys(s.known).forEach(function (n) { if (!L[n] && !todo.some(function (t) { return t[0] === n; })) delete s.known[n]; });
    s.last = Date.now(); s.dirty = res.deferred; markKv('cloudState');
    CS.status = 'ok';
  } catch (e) {
    CS.status = e.auth ? 'auth' : 'err'; CS.err = e.message || String(e);
    if (manual || e.auth) toast((e.auth ? 'Cloud: Anmeldung nötig – ' : 'Cloud: ') + CS.err, 5000);
  }
  CS.applying = false; flush();
  CS.busy = false; CS.progress = ''; updCloudUi();
  if (res.ex || res.tr || res.del) cloudApplied(res);
  if (res.cfg) toast('Ein anderes Gerät hat den Aufbau der Cloud-Datenbank geändert (' + (S.cloudSplit ? 'Übungen und Trainings getrennt' : 'eine Datenbank') + ') – übernommen.', 5000);
  if (res.deferred) setTimeout(function () { cloudSync(); }, 5000);
  if (CS.again) { CS.again = false; setTimeout(function () { cloudSync(); }, 300); }
  if (manual && CS.status === 'ok') toast('Abgeglichen' + (res.up ? ' · ' + res.up + ' gesendet' : '') + ((res.ex || res.tr) ? ' · ' + (res.ex + res.tr) + ' empfangen' : ''));
  return res;
}
function cloudPath(base, kind, id) { return base + '__' + kind + '__' + id + '.json'; }
function cloudApplied(res) {
  UNDO = []; REDO = []; updUndo();
  // Ansicht auf Daten, die es nicht mehr gibt?
  if (st.trId && !DB.tr.get(st.trId)) st.trId = null;
  if (st.runId && !DB.tr.get(st.runId)) st.runId = null;
  if (!isBusy()) { CS.pendingRender = false; $('#cloudbar').style.display = 'none'; render(); }
  else { CS.pendingRender = true; $('#cloudbar').style.display = 'block'; }
  if (S.cloudNotify !== false) {
    var p = [];
    if (res.tr) p.push(res.tr + ' Training' + (res.tr > 1 ? 's' : ''));
    if (res.ex) p.push(res.ex + ' Übung' + (res.ex > 1 ? 'en' : ''));
    if (res.del) p.push(res.del + ' gelöscht');
    toast('Von einem anderen Gerät: ' + p.join(', '), 4000);
  }
}
function updCloudUi() {
  var el = $('#cloudInd'); if (!el) return;
  var on = cloudOn();
  el.style.display = on || (S.cloud && S.cloud !== 'none') ? 'flex' : 'none';
  var cls = !on ? 'warn' : CS.busy ? 'busy' : CS.status === 'auth' || CS.status === 'err' ? 'warn' : CS.status === 'offline' ? 'off' : (cloudState().dirty && S.cloudMode === 'manual') ? 'pend' : 'ok';
  el.className = 'ib cloud ' + cls;
  el.title = cloudLine();
  updMenuDot();
}
function cloudShort() {
  if (CS.busy) return 'Abgleich läuft …';
  if (CS.status === 'offline') return 'offline, wird nachgeholt';
  var s = cloudState(), t = s.last;
  var when = !t ? 'noch nicht abgeglichen' : 'zuletzt ' + (Date.now() - t < 864e5 ? new Date(t).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) + ' Uhr' : fmtDate(new Date(t).toISOString().slice(0, 10)));
  return (S.cloudMode === 'manual' ? 'Abgleich auf Knopfdruck' + (s.dirty ? ' · Änderungen noch nicht abgeglichen' : '') : 'gleicht automatisch ab') + ' · ' + when;
}
function cloudLine() {
  var n = CLOUD_NAMES[S.cloud] || 'Cloud';
  if (!cloudOn()) return n + ': nicht verbunden';
  if (CS.busy) return n + ': Abgleich läuft' + (CS.progress ? ' (' + CS.progress + ')' : ' …');
  if (CS.status === 'auth') return n + ': Anmeldung nötig';
  if (CS.status === 'err') return n + ': Fehler – ' + CS.err;
  if (CS.status === 'offline') return n + ': offline – wird nachgeholt';
  var s = cloudState(), t = s.last ? new Date(s.last) : null;
  return n + (t ? ': abgeglichen ' + (Date.now() - s.last < 864e5 ? t.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : fmtDate(t.toISOString().slice(0, 10))) : ': noch nicht abgeglichen') + (s.dirty ? ' · Änderungen offen' : '');
}

/* ----- Anmelden ----- */
async function cloudConnect(prov) {
  var key = ((S.cloudKeys || {})[prov] || '').trim();
  if (!key) { toast('Bitte zuerst den App-Schlüssel / die Client-ID eintragen'); return; }
  if (!window.crypto || !crypto.subtle) { toast('Dieser Browser unterstützt die Anmeldung nicht'); return; }
  var pk = await pkcePair(), state = randStr(24);
  try { localStorage.setItem('vbtrain-auth', JSON.stringify({ p: prov, v: pk.v, state: state, key: key, t: Date.now() })); } catch (e) {}
  flush();
  location.href = CLOUD_P[prov].authUrl(key, pk.c, state);
}
async function cloudFinish(pend, pl) {
  var P = CLOUD_P[pend.p], auth;
  try {
    if (pl.token) auth = { access: pl.token, refresh: null, exp: Date.now() + (+pl.exp || 3600) * 1000 };
    else auth = await P.exchange(pend.key, pl.code, pend.v);
  } catch (e) { ask('Anmeldung bei ' + CLOUD_NAMES[pend.p] + ' fehlgeschlagen: ' + e.message, [['OK', 1, 'pri']]); return; }
  auth.prov = pend.p; auth.key = pend.key;
  var first = !DB.kv.cloudState || DB.kv.cloudState.prov !== pend.p || !DB.kv.cloudState.last;
  DB.kv.cloudAuth = auth; markKv('cloudAuth');
  S.cloud = pend.p; saveS();
  try { localStorage.removeItem('vbtrain-auth'); } catch (e) {}
  flush(); CS.status = ''; updCloudUi();
  await cloudOffer('Verbunden mit ' + CLOUD_NAMES[pend.p] + '. ');
  toast('Abgleich läuft …', 3000);
  var r = await cloudSync(true);
  if (r && first) ask('Verbunden mit ' + CLOUD_NAMES[pend.p] + '. Erster Abgleich: ' + r.up + ' Einträge hochgeladen, ' + (r.ex + r.tr) + ' aus der Cloud übernommen.' + (Object.keys(cloudLocal()).length ? ' ' + Object.keys(cloudLocal()).length + ' Einträge bleiben nur auf diesem Gerät.' : '') + (S.cloudMode === 'manual' ? ' Abgleich nur auf Knopfdruck (☰ → Jetzt abgleichen).' : ' Ab jetzt wird automatisch abgeglichen.'), [['OK', 1, 'pri']]);
}
// Verbindung eines angemeldeten Geräts an ein anderes weitergeben (z. B. altes iPad, auf dem die Anmeldeseite nicht lädt)
function cloudTransferCode() {
  var a = DB.kv.cloudAuth;
  return cloudCodeString({ transfer: 1, p: a.prov, key: a.key, refresh: a.refresh || null, access: a.refresh ? null : a.access, exp: a.refresh ? 0 : Math.round((a.exp - Date.now()) / 1000) });
}
function cloudShowTransfer() {
  if (!cloudOn()) return;
  var c = cloudTransferCode(), ta = h('textarea', { readOnly: true, style: 'min-height:80px;font-size:12px' }); ta.value = c;
  var ov = h('div', { class: 'modal' });
  var copy = function () { ta.select(); var ok = function () { toast('Code kopiert'); }; try { navigator.clipboard.writeText(c).then(ok, function () { document.execCommand('copy'); ok(); }); } catch (e) { document.execCommand('copy'); ok(); } };
  ov.appendChild(h('div', { class: 'mbox' },
    h('h2', { style: 'margin-top:0' }, 'Verbindung weitergeben'),
    h('div', { class: 'mtxt' }, 'Für ein Gerät, auf dem die Anmeldung bei ' + CLOUD_NAMES[S.cloud] + ' nicht klappt (z. B. iPad Air 2): Code kopieren und zum anderen Gerät bringen (AirDrop, Notizen, Nachricht an sich selbst). Dort ☰ → Einstellungen → Datenbank → „Code einfügen …“.'),
    ta,
    h('div', { class: 'status warn', style: 'margin-top:8px' }, 'Der Code ist wie ein Passwort: Wer ihn hat, kann auf die Trainingsdaten in deinem ' + CLOUD_NAMES[S.cloud] + ' zugreifen. Nicht weitergeben und nach dem Einfügen löschen.' + (S.cloud === 'google' ? ' Google: gilt nur etwa eine Stunde.' : '')),
    h('div', { class: 'mbtns', style: 'margin-top:10px' },
      h('button', { class: 'btn', onclick: function () { ov.remove(); } }, 'Schließen'),
      navigator.share ? h('button', { class: 'btn', onclick: function () { navigator.share({ text: c }).catch(function () {}); } }, '↑ Teilen') : null,
      h('button', { class: 'btn pri', onclick: copy }, 'Code kopieren'))));
  document.body.appendChild(ov);
}
async function cloudAdopt(pl) {
  if (!CLOUD_P[pl.p]) { toast('Unbekannter Anbieter im Code'); return; }
  var auth = { prov: pl.p, key: pl.key, refresh: pl.refresh || null, access: pl.access || null, exp: pl.access ? Date.now() + (+pl.exp || 0) * 1000 : 0 };
  S.cloud = pl.p; S.cloudKeys = S.cloudKeys || {}; S.cloudKeys[pl.p] = pl.key; saveS();
  var first = !DB.kv.cloudState || DB.kv.cloudState.prov !== pl.p || !DB.kv.cloudState.last;
  DB.kv.cloudAuth = auth; markKv('cloudAuth'); flush(); CS.status = ''; updCloudUi();
  try { await cloudToken(!auth.access); } catch (e) { DB.kv.cloudAuth = null; markKv('cloudAuth'); flush(); updCloudUi(); ask('Der Code funktioniert nicht (mehr): ' + e.message + '. Auf dem anderen Gerät einen neuen Code erzeugen.', [['OK', 1, 'pri']]); return; }
  await cloudOffer('Verbunden mit ' + CLOUD_NAMES[pl.p] + '. ');
  var r = await cloudSync(true);
  if (r && first) ask('Verbunden mit ' + CLOUD_NAMES[pl.p] + ' (Verbindung von einem anderen Gerät übernommen). Erster Abgleich: ' + r.up + ' Einträge hochgeladen, ' + (r.ex + r.tr) + ' aus der Cloud übernommen.', [['OK', 1, 'pri']]);
}
function cloudCodeString(pl) { return 'VBT-' + btoa(unescape(encodeURIComponent(JSON.stringify(pl)))); }
function cloudPasteCode(str) {
  var pl;
  try { pl = JSON.parse(decodeURIComponent(escape(atob(String(str).trim().replace(/^VBT-/, ''))))); } catch (e) { toast('Das ist kein gültiger Anmelde-Code'); return; }
  var pend = null; try { pend = JSON.parse(localStorage.getItem('vbtrain-auth') || 'null'); } catch (e) {}
  if (pl.transfer) { cloudAdopt(pl); return; }
  if (!pend || pend.state !== pl.state) { ask('Der Code passt nicht zu einer Anmeldung auf diesem Gerät. Bitte hier „Verbinden“ erneut tippen und den neuen Code verwenden.', [['OK', 1, 'pri']]); return; }
  cloudFinish(pend, pl);
}
async function cloudHandleRedirect() {
  var q = new URLSearchParams(location.search), hs = new URLSearchParams(location.hash.replace(/^#/, ''));
  var state = q.get('state') || hs.get('state'), code = q.get('code'), token = hs.get('access_token'), err = q.get('error') || hs.get('error');
  if (!state || !(code || token || err)) return;
  try { history.replaceState(null, '', redirectUri()); } catch (e) {}
  if (err) { toast('Anmeldung abgebrochen: ' + (q.get('error_description') || hs.get('error_description') || err), 5000); return; }
  var pend = null; try { pend = JSON.parse(localStorage.getItem('vbtrain-auth') || 'null'); } catch (e) {}
  var pl = { state: state, code: code, token: token, exp: hs.get('expires_in') };
  if (pend && pend.state === state) { await cloudFinish(pend, pl); return; }
  // Anmeldung kam in einem anderen Fenster an (z. B. Home-Bildschirm-App auf dem iPad): Code zum Einfügen anzeigen
  var c = cloudCodeString(pl);
  var ov = h('div', { class: 'modal' }), ta = h('textarea', { readOnly: true, style: 'min-height:70px;font-size:12px' }); ta.value = c;
  ov.appendChild(h('div', { class: 'mbox' },
    h('h2', { style: 'margin-top:0' }, 'Anmeldung fast fertig'),
    h('div', { class: 'mtxt' }, 'Die Anmeldung ist in einem anderen Fenster angekommen als dem, in dem sie gestartet wurde. Code kopieren, zur VB-Training-App zurückkehren und dort unter ☰ → Einstellungen → Datenbank „Code einfügen“ tippen.'),
    ta,
    h('div', { class: 'mbtns', style: 'margin-top:10px' },
      h('button', { class: 'btn', onclick: function () { ov.remove(); } }, 'Schließen'),
      h('button', { class: 'btn pri', onclick: function () { ta.select(); try { navigator.clipboard.writeText(c).then(function () { toast('Code kopiert'); }, function () { document.execCommand('copy'); toast('Code kopiert'); }); } catch (e) { document.execCommand('copy'); } } }, 'Code kopieren'))));
  document.body.appendChild(ov);
}
function cloudDisconnect() {
  DB.kv.cloudAuth = null; markKv('cloudAuth');
  DB.kv.cloudState = null; markKv('cloudState');
  DB.kv.cloudLocal = {}; markKv('cloudLocal');
  CS.status = ''; flush(); updCloudUi();
}
function cloudLoop() {
  setInterval(function () { if (cloudOn() && S.cloudMode !== 'manual' && !document.hidden && CS.status !== 'auth') cloudSync(); }, 15000);
  document.addEventListener('visibilitychange', function () {
    if (!cloudOn() || S.cloudMode === 'manual') return;
    if (document.hidden) { if (cloudState().dirty) cloudSync(); }
    else cloudSync();
  });
  window.addEventListener('online', function () { if (cloudOn() && S.cloudMode !== 'manual') cloudSync(); });
}

(async function start() {
  try {
    idb = await idbOpen();
    var ex = await idbAll('ex'), tr = await idbAll('tr'), keys = await idbAll('kv', true), vals = await idbAll('kv');
    ex.forEach(function (e) { DB.ex.set(e.id, normEx(e)); });
    tr.forEach(function (t) { DB.tr.set(t.id, normTr(t)); });
    keys.forEach(function (k, i) { DB.kv[k] = vals[i]; });
  } catch (e) { idb = null; toast('Speicher nicht verfügbar – Eingaben gehen beim Schließen verloren.', 6000); }
  DB.kv.lex = DB.kv.lex || {}; DB.kv.last = DB.kv.last || {}; DB.kv.deleted = DB.kv.deleted || {};
  if (DB.kv.settings) S = Object.assign(clone(DEF_SET), DB.kv.settings);
  if (DB.kv.backup && DB.kv.backupEx == null) { DB.kv.backupEx = DB.kv.backupTr = DB.kv.backup; }
  if (DB.kv.dirtyEx == null && DB.kv.dirty) { DB.kv.dirtyEx = DB.kv.dirtyTr = true; }
  if (!S.coachUrl || /\/vbcoach\/?$/.test(S.coachUrl)) S.coachUrl = DEF_SET.coachUrl;   // alte Vorgabe-Adresse ersetzen
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  refreshPens(); updMenuDot();
  render(true);
  $('#cloudInd').onclick = function () { if (cloudOn() && CS.status !== 'auth') cloudSync(true); else openSettings(); };
  $('#cloudbar').onclick = function () { $('#cloudbar').style.display = 'none'; CS.pendingRender = false; render(); };
  updCloudUi(); cloudLoop();
  await cloudHandleRedirect();
  if (cloudOn() && S.cloudMode !== 'manual') cloudSync();
})();
