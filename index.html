<html lang="de">

<title>VB Training</title>
<style>
:root{--ui:#f5f5f2;--line:#dcdcd6;--txt:#222;--acc:#1f4fd1;--bg:#eeeeea}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);font:16px -apple-system,system-ui,"Segoe UI",sans-serif;color:var(--txt);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
input,textarea,select{-webkit-user-select:text;user-select:text;font:inherit;font-size:16px;color:var(--txt);border:1px solid #d3d3cc;border-radius:9px;padding:8px 10px;background:#fff;max-width:100%}
textarea{width:100%;resize:none;line-height:1.4;min-height:90px}
button{font:inherit;color:inherit;cursor:pointer}
#top{flex:none;background:var(--ui);border-bottom:1px solid var(--line);padding:env(safe-area-inset-top) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));display:flex;align-items:center;gap:6px;min-height:calc(52px + env(safe-area-inset-top))}
#top .app{font-weight:700;font-size:17px;margin-right:6px;white-space:nowrap}
.tabs{display:flex;background:#e6e6e1;border-radius:11px;padding:3px;gap:2px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:9px;white-space:nowrap;font-size:15px}
.tabs button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:600}
.sp{flex:1}
.ib{border:0;background:transparent;width:44px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;position:relative;flex:none}
.ib.dot:after{content:'';position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#e07b00}
#upd{flex:none;display:none;background:#2e9a3a;color:#fff;text-align:center;padding:10px;font-weight:600;cursor:pointer}
#pens{flex:none;display:none;background:var(--ui);border-bottom:1px solid var(--line);padding:2px calc(8px + env(safe-area-inset-right)) 2px calc(8px + env(safe-area-inset-left));align-items:center;gap:2px;overflow-x:auto}

.tb{width:48px;height:44px;border:0;border-radius:10px;background:transparent;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.tb.on{background:#e0e0da}.tb[disabled]{opacity:.3}
.tb svg{width:30px;height:30px;display:block}
.vsep{width:1px;height:26px;background:var(--line);margin:0 6px;flex:none}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 calc(10px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left))}
.wrap{max-width:1150px;margin:0 auto}
.card{background:#fff;border:1px solid #e1e1db;border-radius:14px;padding:12px 14px;margin:12px 0}
.block{background:#f8f8f5;border:1px solid #d9d9d2;border-radius:16px;padding:10px 12px;margin:16px 0}
.bhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.bhead h3{margin:0;font-size:17px}
.time{background:#e8eefb;color:#1d3f8f;border-radius:8px;padding:3px 8px;font-weight:600;font-size:15px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#888;font-weight:600;margin:10px 0 5px}
.btn{border:0;background:#e9e9e4;border-radius:10px;padding:9px 13px;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--acc);color:#fff}
.btn.warn{color:#c0392b}
.btn.sm{padding:6px 10px;font-size:14px}
.btn.ghost{background:transparent;border:1px dashed #bbb}
.btn[disabled]{opacity:.4}
h2{font-size:20px;margin:16px 0 8px}
.muted{color:#888;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#e3ebfb;color:#1d3f8f;border-radius:16px;padding:6px 11px;margin:2px 3px 2px 0;font-size:14px;border:0;line-height:1.2}
.chip.sug{background:#f0f0eb;color:#555}
.chip.sug:before{content:'+';font-weight:700}
.chip.tag{background:#eee7f8;color:#5a2f99}
.chip.on{background:var(--acc);color:#fff}
.chip .x{font-weight:700;opacity:.6}
.chipin input{border:0;padding:6px 4px;min-width:120px;outline:none;background:transparent}
.chipbox{border:1px solid #d3d3cc;border-radius:10px;padding:3px 6px;background:#fff;display:flex;flex-wrap:wrap;align-items:center}
.sugs{margin-top:4px}
.pos{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pc{display:flex;align-items:center;background:#f1f1ec;border-radius:10px;padding:2px}
.pc b{min-width:30px;text-align:center;font-size:13px;color:#555}
.pc span{min-width:24px;text-align:center;font-weight:600}
.pc button{border:0;background:#fff;width:32px;height:32px;border-radius:8px;font-size:18px;line-height:1}
.sum{font-weight:600}
.seg{display:inline-flex;background:#ececea;border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 11px;border-radius:8px;font-size:14px;white-space:nowrap}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cols{display:flex;gap:14px;align-items:flex-start}
.cols>div{flex:1;min-width:0}

.pad{position:relative;border:1px solid #dcdcd5;border-radius:8px;overflow:hidden;background:#fff;touch-action:pan-y;width:100%}
.pad.finger{touch-action:none}
.pad canvas{position:absolute;left:0;top:0;pointer-events:none}
.pad.view{cursor:zoom-in}
.ex .head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ex .title{flex:1;min-width:180px;font-weight:600}
.status{margin-top:10px;padding:8px 10px;border-radius:9px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status.ok{background:#eaf6ec;color:#256b30}
.status.warn{background:#fff3e0;color:#9a5a00}
.status.chg{background:#e8eefb;color:#1d3f8f}
.req{color:#c0392b}
.trow{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#fff;border:1px solid #e1e1db;border-radius:12px;margin:8px 0;cursor:pointer}
.trow .t{flex:1;min-width:0}
.trow .t b{display:block}
.badge{font-size:12px;background:#2e9a3a;color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:110px;border-radius:8px;overflow:hidden;border:1px solid #ddd;background:#fafafa}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .del{position:absolute;top:2px;right:2px;border:0;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;width:26px;height:26px}
.exrow{display:flex;gap:12px;padding:10px;background:#fff;border:1px solid #e1e1db;border-radius:12px;margin:8px 0;cursor:pointer;align-items:flex-start}
.exrow .th{width:130px;flex:none}
.exrow .info{flex:1;min-width:0}
.txt{white-space:pre-wrap;line-height:1.45;-webkit-user-select:text;user-select:text}
.runtxt{white-space:pre-wrap;line-height:1.45;font-size:17px;padding:8px 10px;background:#fafaf7;border-radius:8px;margin-bottom:8px;cursor:zoom-in}
.field{background:#fdebd0;color:#8a4b00;border-radius:7px;padding:2px 8px;font-weight:600;font-size:14px}
.pop{position:fixed;z-index:40;background:#fff;border-radius:14px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:10px 14px 14px;width:max-content;max-width:min(94vw,380px)}
.pop h4{margin:10px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#888;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,42px);gap:8px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ccc;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--acc)}
.wd{width:48px;height:44px;border:0;border-radius:9px;background:#f2f2ef;display:flex;align-items:center;justify-content:center;padding:0}
.wd.on{background:#dbe6fb;box-shadow:inset 0 0 0 2px var(--acc)}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 8px;border-radius:9px;font-size:16px}
.menu button:active{background:#f0f0ec}
.note{font-size:12px;color:#888;margin-top:4px}
input[type=range]{width:100%;height:34px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.mbox{background:#fff;border-radius:16px;padding:18px;max-width:440px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mtxt{margin-bottom:14px;line-height:1.45}
.mbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.viewer{position:fixed;top:0;left:0;right:0;bottom:0;background:#2a2a2a;z-index:50;touch-action:none}
.viewer canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.vbar{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:8px;z-index:2}
.vbar button{border:0;background:rgba(255,255,255,.92);border-radius:12px;min-width:46px;height:46px;font-size:20px;padding:0 12px}
.tview{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:50;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(66px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right)) 40px calc(18px + env(safe-area-inset-left))}
.tview .vbar button{background:#ececea}
.tview .big{white-space:pre-wrap;line-height:1.45;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;z-index:70;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.help h3{margin:18px 0 6px}
.help p,.help li{line-height:1.45}
.empty{padding:30px 10px;text-align:center;color:#888}
.rtb{display:flex;gap:4px;margin-bottom:4px;flex-wrap:wrap}
.rtb button{border:0;background:#ececea;border-radius:8px;min-width:40px;height:36px;padding:0 9px;font-size:15px}
.rtb button.on{background:#dbe6fb;box-shadow:inset 0 0 0 2px var(--acc)}
.rte{min-height:90px;border:1px solid #d3d3cc;border-radius:9px;padding:8px 10px;background:#fff;-webkit-user-select:text;user-select:text;line-height:1.45;outline:none;font-size:16px;-webkit-touch-callout:default}
.rte:focus{border-color:var(--acc)}
.rte:empty:before{content:attr(data-ph);color:#aaa}
.rte ul,.rte ol,.rtx ul,.rtx ol{margin:4px 0;padding-left:26px}
.rte p,.rtx p{margin:0}
.runtxt.rtx{white-space:normal}
.big.rtx{white-space:normal}
.cols>.ci{flex:0 0 50%}
.cols>.cd{flex:1 1 0}
.imgwrap{position:relative}
.rsz{position:absolute;right:-9px;bottom:-9px;width:32px;height:32px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);touch-action:none;cursor:nwse-resize;z-index:3;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center}
.vstage{position:absolute;top:0;left:0;right:0;bottom:0;touch-action:none}
.vtools{position:absolute;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));display:flex;gap:4px;z-index:2;background:rgba(255,255,255,.94);border-radius:14px;padding:3px}
.vtools .tb{width:46px;height:44px}
.vhint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:7px 12px;border-radius:10px;font-size:14px;z-index:2;pointer-events:none;white-space:nowrap}
@media (max-width:540px){#top .app{display:none}.tabs button{padding:8px 9px}}
</style>
</head>
<body>
<div id="top">
  <span class="app">VB Training</span>
  <div class="tabs">
    <button data-view="plan">Planen</button>
    <button data-view="run">Durchführen</button>
    <button data-view="ex">Übungen</button>
  </div>
  <div class="sp"></div>
  <button class="ib" id="menuBtn" title="Menü">☰</button>
</div>
<div id="upd">Neue Version bereit – hier tippen zum Aktualisieren</div>
<div id="pens">
  <button class="tb" data-tool="p0" title="Stift 1"></button>
  <button class="tb" data-tool="p1" title="Stift 2"></button>
  <button class="tb" data-tool="p2" title="Stift 3"></button>
  <button class="tb" data-tool="hl" title="Textmarker"></button>
  <button class="tb" data-tool="er" title="Radierer"></button>
  <div class="vsep"></div>
  <button class="tb" id="undo" title="Rückgängig"><svg viewBox="0 0 30 30"><path d="M10 8l-5 5 5 5" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 13h12a6.5 6.5 0 0 1 0 13h-4" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round"/></svg></button>
  <button class="tb" id="redo" title="Wiederholen"><svg viewBox="0 0 30 30" style="transform:scaleX(-1)"><path d="M10 8l-5 5 5 5" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 13h12a6.5 6.5 0 0 1 0 13h-4" fill="none" stroke="#333" stroke-width="2.2" stroke-linecap="round"/></svg></button>
</div>
<div id="main"></div>
<div id="toast"></div>
<input type="file" id="fileIn" style="display:none">

    navigator.share({ files: [file], title: b.name }).then(function () { backupDone(); close(); toast('Gesichert: ' + b.name); },

    h('div', { style: 'display:flex;flex-direction:column;gap:8px' },

function importAll() {
  var ov = h('div', { class: 'modal' }), close = function () { ov.remove(); };

    close(); importData(data);
  } }, 'Text laden');
  ov.appendChild(h('div', { class: 'mbox' },
    h('h2', { style: 'margin-top:0' }, 'Laden'),
    h('div', { class: 'mtxt' }, 'Eine Sicherung laden. Sie ergänzt die Daten auf diesem Gerät: Neueres bleibt erhalten, Gelöschtes wird auch hier gelöscht.'),
    h('div', { style: 'display:flex;flex-direction:column;gap:8px' },

      } }, '📂 Datei wählen …'),

function importData(data) {
  if (!data || data.app !== 'vbtraining') { toast('Das ist keine VB-Training-Sicherung'); return; }
  var del = data.deleted || {}, nEx = 0, nTr = 0, nDel = 0;
  Object.keys(del).forEach(function (id) {
    var t = del[id]; if (!DB.kv.deleted[id] || DB.kv.deleted[id] < t) DB.kv.deleted[id] = t;
    var e = DB.ex.get(id); if (e && e.updated <= t) { DB.ex.delete(id); idbDel('ex', id); nDel++; }
    var r = DB.tr.get(id); if (r && r.updated <= t) { DB.tr.delete(id); idbDel('tr', id); nDel++; }
  });
  (data.ex || []).forEach(function (e) {
    if (DB.kv.deleted[e.id] && DB.kv.deleted[e.id] >= e.updated) return;
    var c = DB.ex.get(e.id); if (!c || e.updated > c.updated) { DB.ex.set(e.id, normEx(e)); dirtyEx.add(e.id); nEx++; }
  });
  (data.tr || []).forEach(function (e) {
    if (DB.kv.deleted[e.id] && DB.kv.deleted[e.id] >= e.updated) return;
    var c = DB.tr.get(e.id); if (!c || e.updated > c.updated) { DB.tr.set(e.id, normTr(e)); dirtyTr.add(e.id); nTr++; }
  });
  var L = data.lex || {};
  Object.keys(L).forEach(function (k) { DB.kv.lex[k] = DB.kv.lex[k] || {}; Object.keys(L[k]).forEach(function (w) { DB.kv.lex[k][w] = Math.max(DB.kv.lex[k][w] || 0, L[k][w]); }); });
  markKv('lex'); markKv('deleted'); flush();
  render();
  ask('Geladen: ' + nEx + ' Übung(en) und ' + nTr + ' Training(s) neu oder aktualisiert' + (nDel ? ', ' + nDel + ' gelöscht' : '') + '. Was auf diesem Gerät neuer war, blieb erhalten.', [['OK', 1, 'pri']]);
}

/* ================= Aktualisierung (Service Worker) ================= */
(function () {
  if (!('serviceWorker' in navigator) || (location.protocol !== 'https:' && location.hostname !== 'localhost')) return;
  try {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      var lastCheck = Date.now();
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && Date.now() - lastCheck > 60000) { lastCheck = Date.now(); try { reg.update(); } catch (e) {} }
      });
      var show = function () { var b = $('#upd'); b.style.display = 'block'; b.onclick = function () { if (reg.waiting) reg.waiting.postMessage('skip'); }; };
      if (reg.waiting && navigator.serviceWorker.controller) show();
      reg.addEventListener('updatefound', function () {
        var w = reg.installing; if (!w) return;
        w.addEventListener('statechange', function () { if (w.state === 'installed' && navigator.serviceWorker.controller) show(); });
      });
    }).catch(function () {});
    var reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () { if (reloaded) return; reloaded = true; flush(); location.reload(); });
  } catch (e) {}
})();

/* ================= Start ================= */
(async function start() {
  try {
    idb = await idbOpen();
    var ex = await idbAll('ex'), tr = await idbAll('tr'), keys = await idbAll('kv', true), vals = await idbAll('kv');
    ex.forEach(function (e) { DB.ex.set(e.id, normEx(e)); });
    tr.forEach(function (t) { DB.tr.set(t.id, normTr(t)); });
    keys.forEach(function (k, i) { DB.kv[k] = vals[i]; });
  } catch (e) { idb = null; toast('Speicher nicht verfügbar – Eingaben gehen beim Schließen verloren.', 6000); }
  DB.kv.lex = DB.kv.lex || {}; DB.kv.last = DB.kv.last || {}; DB.kv.deleted = DB.kv.deleted || {};
  if (DB.kv.settings) S = Object.assign(clone(DEF_SET), DB.kv.settings);
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  refreshPens(); updMenuDot();
  render(true);
})();
